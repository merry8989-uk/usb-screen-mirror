name: Build Windows EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install --upgrade pyinstaller openpyxl

      - name: Validate logging schema (ProGallery spec)
        run: python logschema/validate_events.py --selftest

      - name: Build EXE
        run: pyinstaller --onefile --noconsole --name PhoneMirror PhoneMirror.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMirror-windows
          path: dist/PhoneMirror.exe
          if-no-files-found: error

      - name: Attach EXE to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PhoneMirror.exe
